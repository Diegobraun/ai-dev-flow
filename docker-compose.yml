name: devflow

services:
  orchestration:
    image: camunda/camunda:8.8.35
    container_name: devflow-camunda
    ports:
      - "26600:26500"
      - "9610:9600"
      - "8180:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 5s
      retries: 40
      start_period: 30s
    volumes:
      - camunda-data:/usr/local/camunda/data
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.10
    container_name: devflow-elasticsearch
    ports:
      - "9210:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - logger.org.elasticsearch.deprecation="OFF"
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cat/health | grep -q green"]
      interval: 5s
      retries: 40
      start_period: 30s
      timeout: 5s
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  camunda-data:
  elasticsearch-data:

configs:
  orchestration-config:
    content: |
      camunda:
        system:
          cpu-thread-count: "2"
          io-thread-count: "2"
        security:
          authentication:
            method: "basic"
            unprotectedApi: true
          authorizations:
            enabled: false
          initialization:
            users:
              - username: "demo"
                password: "demo"
                name: "Demo"
                email: "demo@example.com"
            defaultRoles.admin.users:
              - "demo"
        database.index.numberOfReplicas: 0
        data:
          secondary-storage:
            type: elasticsearch
            elasticsearch:
              cluster-name: elasticsearch
              url: "http://elasticsearch:9200"
